name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    # The server only runs on Windows (pywin32, Altium), and one test reads
    # the ANSI code page
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # The same hash-locked set start_server.py installs into its venv, so a
      # lock that no longer installs fails here instead of on a user's machine
      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # Offline tests only. tests/test_altium_script.py drives a running
      # Altium Designer and cannot run here. tests/test_bridge_json.py
      # imports main.py, which is safe: main.py looks for Altium (and may
      # open a file dialog) only when a tool first runs, not at import.
      - name: Run unit tests
        working-directory: server
        run: python -m unittest -v tests.test_altium_files tests.test_outjob_parser tests.test_sandbox tests.test_start_server tests.test_exchange_lock tests.test_request_format tests.test_win_processes tests.test_altium_install tests.test_label_blocks tests.test_pcblib_file tests.test_script_bundle tests.test_silkscreen tests.test_routing tests.test_schematic_check tests.test_pcb_rules tests.test_pcb_shapes tests.test_drc tests.test_sch_edit tests.test_project_components tests.test_bridge_json tests.test_pcb_layout tests.test_pcb_edit tests.test_router tests.test_hierarchy_check tests.test_screenshot_target tests.test_variants
